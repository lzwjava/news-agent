[project]
name = "news-agent"
version = "0.1.0"
description = "LangGraph-powered AI news agent: fetches YC/OpenAI/Anthropic/AI-media feeds, ranks them and writes an HN-style digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
news-agent = "news_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["news_agent"]